version: '3.8'

services:
  video-chef:
    build:
      context: .
      args:
        RUNTIME: cpu                   # 'cpu' veya 'gpu' (NVIDIA)
    image: video-chef:latest
    container_name: video-chef
    
    volumes:
      - ./input:/app/input:ro          # Input videos + images (read-only)
      - ./output:/app/output:rw        # Output folder (write)
      - ./temp:/app/temp:rw            # Temp folder (write)
    
    environment:
      - PYTHONUNBUFFERED=1
    
    # GPU desteği (NVIDIA)
    # Bunları uncomment et GPU kullanmak için:
    # runtime: nvidia
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

# GPU versiyonu için ayrı servis (opsiyonel)
  video-chef-gpu:
    build:
      context: .
      args:
        RUNTIME: gpu
    image: video-chef:gpu
    container_name: video-chef-gpu
    runtime: nvidia
    
    volumes:
      - ./input:/app/input:ro
      - ./output:/app/output:rw
      - ./temp:/app/temp:rw
    
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
